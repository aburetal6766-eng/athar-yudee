services:
  - type: web
    name: athar-yudee
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_CODE
        value: A12345
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
